<!doctype html>
<html lang="ru">
<head>

  <title>Югпочта — сайт временно недоступен</title>

    p { font-size: 1.1rem; line-height: 1.6; margin: 0; }
    small { display: block; margin-top: 2rem; color: #647680; }
  </style>
</head>
<body>
  <main>
    <h1>Сайт временно недоступен</h1>
    <p>Мы обновляем страницу. Пожалуйста, попробуйте зайти позже.</p>

</html>
